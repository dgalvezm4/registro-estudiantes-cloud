services:
  - type: web
    name: registro-estudiantes-dylan
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RECAPTCHA_ENABLED
        value: "true"
      - key: THYMELEAF_CACHE
        value: "true"
